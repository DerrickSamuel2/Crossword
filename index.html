<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A keyboard-friendly engineering-themed crossword puzzle.">
  <title>Engineering Crossword</title>
  <link rel="stylesheet" href="css/crossword.css">
</head>
<body>
  <header class="site-header">
    <div class="page-shell">
      <p class="eyebrow">Interactive word puzzle</p>
      <h1>Engineering Crossword</h1>
      <p class="intro">Choose a clue or square, then use your keyboard to complete the grid.</p>
    </div>
  </header>

  <main class="page-shell" id="main-content">
    <section class="crossword-game" aria-labelledby="game-heading">
      <h2 id="game-heading" class="visually-hidden">Crossword puzzle</h2>
      <div id="puzzle-wrapper" aria-label="Crossword puzzle grid"></div>
      <div id="puzzle-clues" aria-label="Crossword clues"></div>
    </section>

    <p id="puzzle-status" class="puzzle-status" role="status" aria-live="polite">
      Select a clue or a square to begin.
    </p>
  </main>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/jquery.crossword.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
