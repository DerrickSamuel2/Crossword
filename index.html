<!doctype html>

<!--[if gt IE 8]><!--> <html class="no-js" lang="en"> <!--<![endif]-->
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<title>Qurossword - A javascript crossword puzzle plugin</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js"></script>
	<script src="js/jquery.crossword.js"></script>
	<script src="js/script.js"></script>

	<style type="text/css" media="screen">
	:root {
		--bg: #f3f5fb;
		--panel: #ffffff;
		--panel-muted: #f8f9ff;
		--text: #1f2937;
		--text-soft: #667085;
		--border: #d9deea;
		--accent: #4f46e5;
		--accent-soft: #e6e7ff;
		--success: #1e8e3e;
		--shadow: 0 12px 30px rgba(18, 32, 70, 0.08);
		--radius-lg: 18px;
		--radius-md: 12px;
		--radius-sm: 8px;
	}

	*,
	*::before,
	*::after {
		box-sizing: border-box;
	}

	html,
	body {
		margin: 0;
		padding: 0;
	}

	body {
		font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		color: var(--text);
		background:
			radial-gradient(circle at 10% 10%, rgba(79, 70, 229, 0.08), transparent 35%),
			radial-gradient(circle at 90% 0%, rgba(139, 92, 246, 0.08), transparent 30%),
			var(--bg);
		line-height: 1.5;
		min-height: 100vh;
		padding: 24px 16px 28px;
	}

	.app-shell {
		max-width: 1160px;
		margin: 0 auto;
	}

	.app-header {
		background: linear-gradient(135deg, #ffffff 0%, #f4f6ff 100%);
		border: 1px solid #e6e9f5;
		border-radius: var(--radius-lg);
		padding: 20px 22px;
		box-shadow: var(--shadow);
		margin-bottom: 18px;
	}

	.app-title {
		margin: 0;
		font-size: clamp(1.45rem, 1.8vw, 2rem);
		letter-spacing: 0.01em;
	}

	.app-subtitle {
		margin: 8px 0 0;
		color: var(--text-soft);
		font-size: 0.95rem;
	}

	.puzzle-layout {
		display: grid;
		grid-template-columns: minmax(0, 1.1fr) minmax(290px, 0.9fr);
		gap: 18px;
		align-items: start;
	}

	#puzzle-wrapper,
	#puzzle-clues {
		background: var(--panel);
		border: 1px solid #e4e8f3;
		border-radius: var(--radius-lg);
		box-shadow: var(--shadow);
	}

	#puzzle-wrapper {
		padding: 18px;
		overflow: auto;
	}

	#puzzle-clues {
		padding: 18px 18px 14px;
	}

	table {
		border-collapse: collapse;
		border-spacing: 0;
		max-width: 100%;
		background: #e8ebf6;
		padding: 6px;
		border-radius: var(--radius-md);
	}

	table tr {
		width: 100%;
	}

	table td {
		width: clamp(2rem, 4vw, 2.65rem);
		height: clamp(2rem, 4vw, 2.65rem);
		border: 1px solid var(--border);
		padding: 0;
		margin: 0;
		background-color: #2f3d53;
		position: relative;
	}

	td input {
		width: 100%;
		height: 100%;
		padding: 0;
		border: none;
		text-align: center;
		font-size: clamp(0.95rem, 2vw, 1.35rem);
		font-weight: 600;
		text-transform: uppercase;
		color: #4a5568;
		background-color: #fbfcff;
		outline: none;
		transition: background-color 0.15s ease, color 0.15s ease;
	}

	td input:focus {
		background-color: #ffffff;
		color: #111827;
	}

	td span {
		color: #4b5563;
		font-size: 0.63rem;
		font-weight: 700;
		position: absolute;
		top: 1px;
		left: 2px;
		line-height: 1;
	}

	input.done {
		font-weight: 700;
		color: var(--success);
		background-color: #effdf2;
	}

	.active,
	.clues-active {
		background-color: var(--accent-soft) !important;
	}

	.clue-done {
		color: #98a2b3;
		text-decoration: line-through;
	}

	#puzzle-clues h2 {
		font-size: 0.88rem;
		margin: 4px 0 8px;
		text-transform: uppercase;
		letter-spacing: 0.08em;
		color: #4f5d78;
	}

	#puzzle-clues ol {
		margin: 0 0 14px;
		padding-left: 22px;
	}

	#puzzle-clues li {
		font-size: 0.95rem;
		margin: 0 0 6px;
		line-height: 1.45;
		padding: 4px 6px;
		border-radius: var(--radius-sm);
		transition: background-color 0.15s ease, color 0.15s ease;
		cursor: pointer;
	}

	#puzzle-clues li:hover {
		background-color: var(--panel-muted);
	}

	#puzzle-clues li.clues-active {
		color: #1d2a57;
		font-weight: 600;
	}

	@media (max-width: 960px) {
		.puzzle-layout {
			grid-template-columns: 1fr;
		}

		#puzzle-wrapper,
		#puzzle-clues {
			padding: 14px;
		}
	}

	@media (max-width: 560px) {
		body {
			padding: 14px 10px 18px;
		}

		.app-header {
			padding: 14px 14px;
			border-radius: 14px;
		}

		#puzzle-wrapper,
		#puzzle-clues {
			border-radius: 14px;
		}

		#puzzle-clues li {
			font-size: 0.9rem;
			padding: 4px 5px;
		}
	}
	</style>

</head>

<body>
	<div class="app-shell">
		<header class="app-header">
			<h1 class="app-title">Qurossword</h1>
			<p class="app-subtitle">Challenge yourself with this interactive crossword puzzle.</p>
		</header>

		<main class="puzzle-layout">
			<div id="puzzle-wrapper"><!-- crossword puzzle appended here --></div>
		</main>
	</div>
</body>
</html>
